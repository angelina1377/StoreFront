<h1>Товары в категории «{{ category.name }}</h1>
{% if products %}
  <ul>
    {% for product in products %}
      <li>
        <a href="{% url 'product_detail' product.pk %}">{{ product.name }}</a>
        ({{ product.price }} ₽)
      </li>
    {% endfor %}
  </ul>
{% else %}
  <p>В этой категории пока нет товаров.</p>
{% endif %}
