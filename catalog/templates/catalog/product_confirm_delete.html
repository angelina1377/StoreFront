{% extends "catalog/base.html" %}

{% block title %}Удаление товара{% endblock %}

{% block content %}
<h1>Вы уверены, что хотите удалить товар «{{ product.name }}»?</h1>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'catalog:product_detail' product.pk %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
