{% extends "catalog/base.html" %}

{% block title %}{{ product.name }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6">
        {% if product.image %}
            <img src="{{ product.image.url }}" class="img-fluid rounded shadow" alt="{{ product.name }}">
        {% else %}
            <div class="bg-light d-flex align-items-center justify-content-center" style="height: 400px;">
                <span class="text-muted">Нет фото</span>
            </div>
        {% endif %}
    </div>
    <div class="col-md-6">
        <h1>{{ product.name }}</h1>
        <p class="lead text-muted">Цена: <strong>{{ product.price }} руб.</strong></p>
        <hr>
        <h4>Описание</h4>
        <p>{{ product.description }}</p>
        <a href="{% url 'catalog:product_list' %}" class="btn btn-outline-secondary">← Вернуться в каталог</a>
    </div>
</div>
{% endblock %}
