<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена | StoreFront</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; }
        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
        }
        .error-code {
            font-size: 10rem;
            font-weight: 700;
            color: #4f46e5;
            line-height: 1;
        }
    </style>
</head>
<body>
    <div class="container error-container">
        <div class="error-code">404</div>
        <h1 class="display-4 fw-bold">Страница не найдена</h1>
        <p class="lead text-muted mb-4">К сожалению, запрошенный ресурс не существует.</p>
        <a href="/" class="btn btn-primary btn-lg px-4">Вернуться на главную</a>
    </div>
</body>
</html>
