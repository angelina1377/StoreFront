{% extends "catalog/base.html" %}

{% block title %}Удаление статьи{% endblock %}

{% block content %}
<h3>Вы уверены, что хотите удалить статью?</h3>
<p>«<strong>{{ post.title }}</strong>» будет безвозвратно удалена.</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'blog:blog_detail' post.pk %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
